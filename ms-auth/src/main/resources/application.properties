spring.application.name=ms-auth
server.port=8084

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ms_auth}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

auth.admin.nombre=${AUTH_ADMIN_NAME:Administrador}
auth.admin.email=${AUTH_ADMIN_EMAIL:}
auth.admin.password=${AUTH_ADMIN_PASSWORD:}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: openapi-contacto
              uri: ${MS_CONTACTO_URL:http://localhost:8092}
              predicates:
                - Path=/v3/api-docs/contacto
              filters:
                - SetPath=/v3/api-docs

            - id: openapi-cursos
              uri: ${MS_CURSOS_URL:http://localhost:8091}
              predicates:
                - Path=/v3/api-docs/cursos
              filters:
                - SetPath=/v3/api-docs

            - id: openapi-recetas
              uri: ${MS_RECETAS_URL:http://localhost:8090}
              predicates:
                - Path=/v3/api-docs/recetas
              filters:
                - SetPath=/v3/api-docs

            - id: openapi-auth
              uri: ${MS_AUTH_URL:http://localhost:8094}
              predicates:
                - Path=/v3/api-docs/auth
              filters:
                - SetPath=/v3/api-docs

            - id: ms-recetas
              uri: ${MS_RECETAS_URL:http://localhost:8090}
              predicates:
                - Path=/api/v1/recipes/**,/api/v1/admin/recipes/**,/imagenes/recetas/**

            - id: ms-cursos
              uri: ${MS_CURSOS_URL:http://localhost:8091}
              predicates:
                - Path=/api/cursos/**,/api/categorias/**,/api/v1/admin/cursos/**,/imagenes/cursos/**

            - id: ms-contacto
              uri: ${MS_CONTACTO_URL:http://localhost:8092}
              predicates:
                - Path=/api/contacto/**,/api/consultas/**

            - id: ms-auth
              uri: ${MS_AUTH_URL:http://localhost:8094}
              predicates:
                - Path=/api/auth/**,/imagenes/perfiles/**

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - ${CORS_ALLOWED_ORIGIN_PATTERN:http://localhost:*}
                  - ${CORS_ALLOWED_HTTPS_ORIGIN_PATTERN:https://localhost:*}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - '*'
                exposed-headers:
                  - Location
                allow-credentials: true
                max-age: 3600

security:
  jwt:
    secret: hDUk+l5wNMzrHajuB3K7Ic1GtdJYf9cGq10UgDwCnd0=

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - gateway
  endpoint:
    gateway:
      access: read-only

# Cada especificación usa el origen del gateway para ejecutar Try it out.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: Autenticación y perfil
        url: /v3/api-docs/auth
      - name: Recetas
        url: /v3/api-docs/recetas
      - name: Cursos
        url: /v3/api-docs/cursos
      - name: Contacto
        url: /v3/api-docs/contacto
